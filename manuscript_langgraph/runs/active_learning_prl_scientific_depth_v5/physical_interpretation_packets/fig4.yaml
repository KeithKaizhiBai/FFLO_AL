figure_id: Fig4
direct_visual_observations:
- At mu/t=-0.45 and 0.15, trusted cFFLO occupies lower JA while sampled tFFLO is concentrated at higher JA and lower
  temperature.
- At mu/t=0.85, uniform-SC support broadens in JA and trusted tFFLO spans a wider part of the sampled slice.
- At mu/t=1.45, sampled superconducting support is restricted to low JA and moderate-to-low temperature, and no
  trusted tFFLO point occurs in the narrow slice.
