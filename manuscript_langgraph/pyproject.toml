[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al-fflo-manuscript-langgraph"
version = "0.1.0"
description = "Evidence-first PRL manuscript workflow for the AL FFLO project"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "langgraph-checkpoint-sqlite>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
