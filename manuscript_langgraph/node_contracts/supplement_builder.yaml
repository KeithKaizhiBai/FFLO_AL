{
  "node_id": "supplement_builder",
  "purpose": "assemble the S1-S7 Supplement structure from approved evidence contracts",
  "inputs": ["contracts/supplement_structure.yaml", "frozen_claims", "approved_results"],
  "outputs": ["supplement_draft", "supplement_trace"],
