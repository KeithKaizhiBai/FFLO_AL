  - {id: exact_oracle, type: workflow_schematic, source: schematic_generator, schematic: true, bbox: required}
  - {id: topology_triptych, type: topology_schematic, source: schematic_generator, schematic: true, bbox: required, features: [cfflo_gapped_nu0, transition_gap_closing, tfflo_reopened_gapped_nu1, boundary_state_separate]}
layout:
  canvas: {viewbox: [0, 0, 1600, 1080], print_mm: [178.0, 120.15]}
  template_profile: schematic
  bounding_boxes: {}
  alignment_anchors: [canvas_center, central_card]
  declared_overlays: [dense_3d_surface_under_vector_annotations]
  declared_exceptions: []
color_semantics:
