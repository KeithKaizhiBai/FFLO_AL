primary_object: {id: physical_state_space, asset_type: landscape_3d, scientific_role: thermodynamic_and_topology_resolved_states, visual_role: primary}
secondary_objects:
  - {id: exact_oracle, asset_type: workflow_schematic, scientific_role: physical_evidence_source, visual_role: secondary}
  - {id: topology_triptych, asset_type: topology_schematic, scientific_role: topology_resolution, visual_role: secondary}
tertiary_information:
  - {id: scheduler_cycle, scientific_role: computational_scheduling, visual_role: tertiary}
data_sources: [MODEL_SPEC.md, docs/NUMERICS_SPEC.md]
assets:
