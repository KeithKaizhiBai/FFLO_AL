text_budget: {maximum_words_in_artwork: 115, maximum_words_per_panel: 28, minimum_font_size_pt: 7.0, move_excess_to: caption}
required_elements: [exact_oracle, physical_state_space, topology_resolution]
required_labels: [Exact BdG oracle, cFFLO, tFFLO]
forbidden_elements: [dashboard_equal_weight, provenance_in_artwork]
forbidden_claims: [ML replaces the solver, topology determined by free-energy depth]
validation_requirements: {hard_fail: true, require_geometry_manifest: true, require_editable_svg: true, require_pdf: true, require_png_preview: true, require_grayscale_review: true, require_engine_preflight: true}
provenance: {physics_recomputed: false, parameters_recorded: true, commit_hash_when_available: true}
approval: {gate: EXAMPLE_GATE, state: HUMAN_WAIT}
