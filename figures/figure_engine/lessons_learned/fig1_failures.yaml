schema_version: 1
figure_id: fig1
purpose: reusable_failure_memory

failures:
  - type: central_object_too_small
    cause: equal_panel_weight_or_container_alias_hiding_small_subobject
    prevention: declare_primary_and_internal_area_thresholds
    enforced_by: [bbox_checker.primary_visual_area, bbox_checker.declared_area_requirements]

  - type: text_below_print_floor
    cause: solving_overcrowding_by_shrinking_type
    prevention: reject_text_below_contract_minimum_and_restructure_layout
    enforced_by: [SVGBuilder.text, font_checker.minimum_font_size]

  - type: font_stretch_or_condensation
    cause: fitting_labels_by_transform_or_narrow_face
    prevention: normal_width_font_stack_and_uniform_scale_only
    enforced_by: [font_checker.normal_width_fonts, font_checker.nonuniform_text_scaling]

  - type: text_or_card_collision
    cause: local_changes_without_registered_geometry
    prevention: measured_bboxes_parent_clearance_and_independent_gutters
    enforced_by: [text_collision_checker, bbox_checker]

  - type: reliability_row_border_clearance
    cause: older_lint_checked_containment_but_not_minimum_text_border_clearance
    prevention: hard_4px_text_to_parent_border_rule
    current_regression:
      object: reliability-row-1
      observed_px: 3.25
      required_px: 4.0
      status: known_failure_do_not_fix_without_authorization

  - type: constant_width_or_decorative_arrows
    cause: generic_path_drawing_without_flow_tokens
    prevention: registered_source_target_and_tapered_profile
    enforced_by: [route_checker.workflow_source_target, route_checker.workflow_profile]

  - type: topology_transition_conflated_with_tfflo
    cause: closing_state_and_final_phase_not_structurally_separated
    prevention: require_cfflo_gapped_transition_closing_tfflo_reopened_features
    enforced_by: [asset_checker.required_scientific_features, fig1_specific_lint, human_scientific_review]

  - type: ml_workflow_dominates_physics
    cause: process_infographic_equal_weight
    prevention: primary_physics_area_floor_and_prohibited_solver_replacement_claim
    enforced_by: [bbox_checker.primary_visual_area, scientific_checker.prohibited_claims, human_first_fixation_review]

  - type: preflight_without_token_inheritance
    cause: legacy_builder_reads_rules_but_retains_local_constants
    prevention: engine_native_builders_or_explicit_legacy_token_adapter
    status: known_architecture_debt_before_fig1_engine_regeneration
